name: CI & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push and pull request: the same checks you run locally.
  check:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Build-time only; the real values live in Vercel's project settings.
          NEXT_PUBLIC_SITE_URL: https://rameshkumaran.vercel.app
          AUTH_SECRET: ci-placeholder-secret
          AUTH_TRUST_HOST: "true"

  # Optional: deploy to Vercel from GitHub Actions instead of (or in addition to) Vercel's
  # native Git integration. Enable it by adding the repository secrets
  #   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  # (see README → "Deploying"). When the secrets are absent the job is skipped.
  deploy:
    name: Deploy to Vercel (production)
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rameshkumaran.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip when Vercel secrets are not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set — skipping Actions deploy (Vercel's Git integration handles deploys)."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings & env
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output
        if: env.VERCEL_TOKEN != ''
        # The .git folder is removed so the CLI doesn't attach commit-author metadata, which Vercel
        # rejects when the author's email isn't linked to a Vercel-connected GitHub account.
        run: |
          rm -rf .git
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment-url.txt
          echo "Deployed: $(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
